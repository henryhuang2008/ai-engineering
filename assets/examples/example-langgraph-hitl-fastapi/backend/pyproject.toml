[project]
name = "langgraph-hitl-fastapi"
version = "0.1.0"
description = "Human-in-the-loop LangGraph demos behind FastAPI: blocking, SSE, and MCP tool approval"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-core>=0.3.65",
    "langchain-deepseek>=0.1.1",
    "langchain-mcp-adapters>=0.1.7",
    "langgraph>=0.4.8",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.0",
    "sse-starlette>=2.1.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
# Notebooks only: the Jupyter kernel and the Mermaid PNG renderer's HTTP client.
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.26.0",
    "jupyterlab>=4.2.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
