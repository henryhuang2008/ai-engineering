[project]
name = "0021-text-to-sql"
version = "0.1.0"
description = "A custom LangGraph text-to-SQL agent over a local SQLite database, with a read-only guard and human review."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6,<0.7",
    "langchain-openai>=0.3,<0.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
