[project]
name = "example-voice-langgraph"
version = "0.1.0"
description = "Voice agent: faster-whisper or Qwen ASR -> LangGraph + DeepSeek -> Qwen3-TTS"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-deepseek>=1.0,<2",
    "langchain-mcp-adapters>=0.3,<1",
    "mcp[cli]>=1.30,<2",
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "sqlalchemy>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "sounddevice>=0.5,<1",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
]
