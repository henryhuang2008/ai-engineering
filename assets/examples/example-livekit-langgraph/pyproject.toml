[project]
name = "example-livekit-langgraph"
version = "0.1.0"
description = "Voice agent over LiveKit: Qwen ASR -> LangGraph + DeepSeek -> Qwen3-TTS"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[silero]>=1.8,<2",
    "livekit>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-deepseek>=1.0,<2",
    "langchain-mcp-adapters>=0.3,<1",
    "mcp[cli]>=1.30,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
]
