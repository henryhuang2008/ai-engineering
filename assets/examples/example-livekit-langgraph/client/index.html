<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna — LiveKit expense agent</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --line: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --user: #d29922;
    --agent: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input, button {
    font: inherit;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #0b0f14;
    color: var(--text);
    padding: 9px 12px;
    width: 100%;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .actions { display: flex; gap: 8px; }
  button { cursor: pointer; width: auto; min-width: 120px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .status b { color: var(--text); font-weight: 600; }
  #log { display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
  .line { display: grid; grid-template-columns: 64px 1fr; gap: 10px; font-size: 14px; }
  .who { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding-top: 3px; }
  .who.you { color: var(--user); }
  .who.luna { color: var(--agent); }
  .empty { color: var(--muted); font-size: 14px; }
  code { background: #0b0f14; padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  .warning {
    border: 1px solid #d29922;
    background: #2a1f0a;
    color: #f0d48a;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 14px;
    line-height: 1.55;
  }
  .warning code { background: #1a1206; }
</style>
</head>
<body>
<main>
  <h1>Luna — expense agent</h1>
  <p class="sub">LiveKit room client. The agent worker must be running (<code>uv run python agent.py dev</code>).</p>

  <div id="warning" class="warning" hidden></div>

  <section class="panel">
    <div class="row">
      <div>
        <label for="url">Server URL</label>
        <input id="url" value="ws://127.0.0.1:7880" spellcheck="false">
      </div>
      <div>
        <label for="token">Join token</label>
        <input id="token" placeholder="uv run python make_token.py" spellcheck="false">
      </div>
    </div>
    <div class="actions">
      <button id="connect" class="primary">Connect</button>
      <button id="sound" hidden>Enable sound</button>
      <button id="disconnect" disabled>Disconnect</button>
    </div>
    <div class="status" id="status">Not connected.</div>
  </section>

  <section class="panel">
    <div id="log"><div class="empty">Transcripts appear here once you speak.</div></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
  const { Room, RoomEvent, Track } = LivekitClient;
  const $ = (id) => document.getElementById(id);
  const log = $("log");
  const status = $("status");
  let room = null;
  let hasLine = false;
  const linesById = new Map();

  function addLine(who, segment) {
    if (!hasLine) { log.innerHTML = ""; hasLine = true; }

    let entry = linesById.get(segment.id);
    if (!entry) {
      const line = document.createElement("div");
      line.className = "line";
      const label = document.createElement("div");
      label.className = "who " + (who === "you" ? "you" : "luna");
      label.textContent = who === "you" ? "You" : "Luna";
      const body = document.createElement("div");
      line.append(label, body);
      log.append(line);
      entry = { body };
      linesById.set(segment.id, entry);
    }
    // Live partials share an id, so the same line is rewritten until final.
    entry.body.textContent = segment.text;
    entry.body.style.opacity = segment.final ? "1" : ".6";
    log.scrollTop = log.scrollHeight;
  }

  async function connect() {
    const url = $("url").value.trim();
    const token = $("token").value.trim();
    if (!token) { status.textContent = "Paste a token first: uv run python make_token.py"; return; }

    $("connect").disabled = true;
    status.textContent = "Connecting…";

    room = new Room({ adaptiveStream: true, dynacast: true });
    window.lunaRoom = room;   // handy in DevTools: lunaRoom.canPlaybackAudio

    room.on(RoomEvent.Connected, () => {
      status.innerHTML = "Connected to <b>" + room.name + "</b> as <b>" + room.localParticipant.identity + "</b>";
      $("disconnect").disabled = false;
    });
    room.on(RoomEvent.Disconnected, () => {
      status.textContent = "Disconnected.";
      $("connect").disabled = false;
      $("disconnect").disabled = true;
    });
    room.on(RoomEvent.TranscriptionReceived, (segments, participant) => {
      const who = participant && participant.identity.startsWith("agent") ? "luna" : "you";
      for (const segment of segments) addLine(who, segment);
    });
    room.on(RoomEvent.TrackSubscribed, (track) => {
      // The SDK does not put the agent's audio in the DOM for us: attach it.
      if (track.kind !== Track.Kind.Audio) return;
      const element = track.attach();
      element.autoplay = true;
      element.dataset.speaker = "luna";
      element.style.display = "none";
      document.body.appendChild(element);
    });
    room.on(RoomEvent.TrackUnsubscribed, (track) => {
      track.detach().forEach((element) => element.remove());
    });
    room.on(RoomEvent.AudioPlaybackStatusChanged, () => {
      // The browser blocks autoplay until a gesture; this is how it tells us.
      $("sound").hidden = room.canPlaybackAudio;
    });

    try {
      await room.connect(url, token);
    } catch (error) {
      status.textContent = "Failed: " + error.message;
      $("connect").disabled = false;
      return;
    }

    try {
      await room.startAudio();          // click already counts as a gesture
    } catch (error) {
      // ignored: the Enable sound button appears instead
    }
    $("sound").hidden = room.canPlaybackAudio;

    try {
      await room.localParticipant.setMicrophoneEnabled(true);
      status.innerHTML += " — <b>microphone on</b>, speak after the greeting.";
    } catch (error) {
      status.innerHTML += " — <b>microphone blocked</b> (" + error.message + ")";
      addLine("you", { id: "mic-blocked", text: "Microphone blocked. Click the padlock in the address bar, allow the microphone, then reconnect.", final: true });
    }
  }

  async function enableSound() {
    if (!room) return;
    try { await room.startAudio(); } catch (error) { status.textContent = "Could not start audio: " + error.message; }
    $("sound").hidden = room.canPlaybackAudio;
  }

  async function disconnect() {
    if (room) await room.disconnect();
    room = null;
  }

  $("connect").addEventListener("click", connect);
  $("sound").addEventListener("click", enableSound);
  $("disconnect").addEventListener("click", disconnect);

  (function preflight() {
    const warning = $("warning");
    if (location.protocol === "file:") {
      warning.hidden = false;
      warning.innerHTML =
        "<b>Open this page over HTTP, not as a file.</b> Browsers block the microphone on <code>file://</code>." +
        "<br>Run <code>cd client</code> then <code>python -m http.server 8000</code>, and open " +
        "<code>http://localhost:8000</code>.";
    } else if (!window.isSecureContext) {
      warning.hidden = false;
      warning.textContent =
        "This origin is not a secure context, so the microphone will be blocked. Use http://localhost or https.";
    }
  })();
</script>
</body>
</html>
